<div class="modal-backdrop" (click)="handleClose()">
  <div class="modal-dialog" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>{{ task ? 'Edit Task Specifications' : 'Create New Work Item' }}</h2>
      <button class="close-btn" (click)="handleClose()">✕</button>
    </div>

    <form (ngSubmit)="saveTask()" class="modal-form">
      <div class="form-grid">
        <!-- Title -->
        <div class="form-group full-width">
          <label>Task Title *</label>
          <input 
            type="text" 
            [(ngModel)]="title" 
            name="title" 
            placeholder="e.g., Integrate Stripe Payment Gateway" 
            required
            class="form-control"
          />
        </div>

        <!-- Description -->
        <div class="form-group full-width">
          <label>Detailed Specifications</label>
          <textarea 
            rows="3" 
            [(ngModel)]="description" 
            name="description" 
            placeholder="Describe deliverables, technical requirements, acceptance criteria..."
            class="form-control"
          ></textarea>
        </div>

        <!-- Category & Tags -->
        <div class="form-group">
          <label>Category</label>
          <input 
            type="text" 
            [(ngModel)]="category" 
            name="category" 
            placeholder="e.g. Backend, Frontend, DevOps" 
            class="form-control"
          />
        </div>

        <div class="form-group">
          <label>Tags (Comma separated)</label>
          <input 
            type="text" 
            [(ngModel)]="tags" 
            name="tags" 
            placeholder="e.g. api, auth, urgent" 
            class="form-control"
          />
        </div>

        <!-- Status & Priority -->
        <div class="form-group">
          <label>Workflow Status</label>
          <select [(ngModel)]="status" name="status" class="form-control">
            <option [value]="2">To Do</option>
            <option [value]="3">In Progress</option>
            <option [value]="4">Review</option>
            <option [value]="5">Done</option>
            <option [value]="6">Blocked</option>
          </select>
        </div>

        <div class="form-group">
          <label>Urgency Priority</label>
          <select [(ngModel)]="priority" name="priority" class="form-control">
            <option [value]="1">Low</option>
            <option [value]="2">Medium</option>
            <option [value]="3">High</option>
            <option [value]="4">Critical / Urgent</option>
          </select>
        </div>

        <!-- Estimated Hours & Due Date -->
        <div class="form-group">
          <label>Estimated Hours</label>
          <input 
            type="number" 
            [(ngModel)]="estimatedHours" 
            name="estimatedHours" 
            placeholder="e.g. 12" 
            class="form-control"
          />
        </div>

        <div class="form-group">
          <label>Due Date</label>
          <input 
            type="date" 
            [(ngModel)]="dueDate" 
            name="dueDate" 
            class="form-control"
          />
        </div>

        <!-- Team & Assignee -->
        <div class="form-group">
          <label>Department / Team</label>
          <select [(ngModel)]="teamId" name="teamId" class="form-control">
            <option [ngValue]="null">None (Cross-functional)</option>
            @for (team of teams(); track team.id) {
              <option [ngValue]="team.id">{{ team.name }}</option>
            }
          </select>
        </div>

        <div class="form-group">
          <label>Assignee</label>
          <select [(ngModel)]="assignedToUserId" name="assignedToUserId" class="form-control">
            <option [ngValue]="null">Unassigned</option>
            @for (user of users(); track user.id) {
              <option [ngValue]="user.id">{{ user.fullName }} ({{ user.role }})</option>
            }
          </select>
        </div>

        <!-- Initial Subtasks (When creating new task) -->
        @if (!task) {
          <div class="form-group full-width">
            <label>Initial Subtasks Breakdown (1 per line)</label>
            <textarea 
              rows="2" 
              [(ngModel)]="initialSubtasksText" 
              name="initialSubtasksText" 
              placeholder="Design UI layout&#10;Write integration test suite&#10;Deploy to staging"
              class="form-control"
            ></textarea>
          </div>
        }

        <!-- Admin Remarks -->
        <div class="form-group full-width">
          <label>Administrative Remarks</label>
          <input 
            type="text" 
            [(ngModel)]="remarks" 
            name="remarks" 
            placeholder="Internal tracking remarks..." 
            class="form-control"
          />
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="handleClose()">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="loading()">
          {{ loading() ? 'Saving Work Item...' : (task ? 'Save Changes' : 'Create Task') }}
        </button>
      </div>
    </form>
  </div>
</div>
