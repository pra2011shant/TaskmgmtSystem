name: Build, Test & CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-build-and-test:
    name: Backend CI (.NET 8 & Unit Tests)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Backend Dependencies
      run: dotnet restore Backend/ManagementSystem/ManagementSystem.csproj

    - name: Build Backend Web API
      run: dotnet build Backend/ManagementSystem/ManagementSystem.csproj --configuration Release --no-restore

    - name: Execute Backend Test Suite
      run: dotnet test Backend/ManagementSystem.Tests/ManagementSystem.Tests.csproj --configuration Release --verbosity normal

  frontend-build:
    name: Frontend CI (Angular 19 & Compilation)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: Frontend/ManagementSystemUI/package-lock.json

    - name: Install Frontend Dependencies
      run: npm ci --prefix Frontend/ManagementSystemUI

    - name: Build Angular 19 Production Bundle
      run: npm run build --prefix Frontend/ManagementSystemUI -- --configuration production
