name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-build:
    name: Build & Test Backend (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Backend Dependencies
        run: |
          dotnet restore Backend/ManagementSystem/ManagementSystem.csproj
          dotnet restore Backend/ManagementSystem.Tests/ManagementSystem.Tests.csproj

      - name: Build Web API (Release)
        run: dotnet build Backend/ManagementSystem/ManagementSystem.csproj --configuration Release --no-restore

      - name: Execute Automated Unit Tests
        run: dotnet test Backend/ManagementSystem.Tests/ManagementSystem.Tests.csproj --configuration Release --no-restore --verbosity normal

  frontend-build:
    name: Build Frontend (Angular 19 Standalone)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Frontend/ManagementSystemUI/package-lock.json

      - name: Clean Install NPM Dependencies
        working-directory: Frontend/ManagementSystemUI
        run: npm ci

      - name: Build Production Angular Bundle
        working-directory: Frontend/ManagementSystemUI
        run: npm run build
