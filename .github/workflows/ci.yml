name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-build:
    name: Build & Test Backend (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Backend/ManagementSystem/ManagementSystem.csproj

      - name: Build Backend
        run: dotnet build Backend/ManagementSystem/ManagementSystem.csproj --configuration Release --no-restore

  frontend-build:
    name: Build Frontend (Angular 19)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: Frontend/ManagementSystemUI
        run: npm ci

      - name: Build Frontend
        working-directory: Frontend/ManagementSystemUI
        run: npm run build
